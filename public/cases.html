<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>事件をさがす ｜ 応援傍聴ナビ</title>
<meta name="description" content="傍聴席に、ひとり増える。それだけで法廷は変わる。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23f2e4c9'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="stamp" aria-hidden="true">傍聴</div>
    <div>
      <h1><a href="index.html">応援傍聴ナビ</a></h1>
      <p>傍聴席に、ひとり増える。それだけで法廷は変わる。</p>
    </div>
  </header>

  <a class="backlink" href="index.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> トップに戻る</a>

  <section aria-labelledby="search-h" style="margin-top:28px">
    <p class="sech" id="search-h">事件をさがす</p>
    <div class="search"><i class="bi bi-search" aria-hidden="true"></i><input type="text" id="q" placeholder="事件名で検索" aria-label="事件名で検索"></div>
    <div class="tags" id="tagFilters" style="margin-top:14px"></div>
    <div class="tabs" id="statusTabs"></div>
    <div class="clist" id="clist"></div>
  </section>

  <p class="status" id="status"></p>
  <input type="file" id="fileInput" accept="application/json,.json" style="display:none;">

  <footer class="site-footer">
    <a href="request.html">掲載をご希望の方へ</a><span class="sep">・</span><a href="https://github.com/minnanosaiban/court-calendar" target="_blank" rel="noopener">ソースコード（GitHub）<i class="bi bi-box-arrow-up-right" aria-hidden="true"></i></a>
    <p class="disc">本サイトは有志による非公式のツールです。掲載情報の正確性・完全性・最新性は保証しません。期日等は必ず裁判所からの公式な通知でご確認ください。本サイトの利用により生じたいかなる損害についても運営者は責任を負わず、本サイトは法的助言を提供するものではありません。事件の説明は呼びかけ人の主張であり、裁判所が認定した事実とは限りません。当事者のお名前は、ご本人が実名での掲載を望まれる場合をのぞき掲載しません。</p>
  </footer>
</div>

<!-- 期日・事件情報・資料・写真の編集モーダルは lib.js が1つの窓として生成する（EXTRA_MODALS） -->

<script src="lib.js"></script>
<script>
(function(){
  "use strict";
  const qEl=document.getElementById("q");
  const tagFilters=document.getElementById("tagFilters");
  const statusTabs=document.getElementById("statusTabs");
  const clistEl=document.getElementById("clist");
  const statusEl=document.getElementById("status");
  let activeTag = new URLSearchParams(location.search).get("tag") || "";
  let activeStatus = "open";   // "open"=進行中 / "archived"=終結

  function allTagsWithCount(){
    const m=new Map();
    CC.cases.forEach(c=>(c.tags||[]).forEach(t=>m.set(t,(m.get(t)||0)+1)));
    return [...m.entries()].sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0],"ja"));
  }
  function renderTagFilters(){
    const tags=allTagsWithCount();
    if(!tags.length){ tagFilters.innerHTML=""; return; }
    let html = `<a class="tag${!activeTag?" on":""}" data-tagf="">すべて</a>`;
    html += tags.map(([t])=>`<a class="tag${activeTag===t?" on":""}" data-tagf="${CC.escapeAttr(t)}">${CC.escapeHtml(t)}</a>`).join("");
    tagFilters.innerHTML = html;
    tagFilters.querySelectorAll("[data-tagf]").forEach(a=>{
      a.addEventListener("click",(e)=>{ e.preventDefault(); activeTag=a.dataset.tagf; renderTagFilters(); renderTabs(); renderList(); });
    });
  }
  function rowHtml(c){
    const next = CC.nextEvent(c.id);
    const nextLine = c.archivedAt
      ? `終結：${CC.escapeHtml(c.archivedAt.replace(/-/g,"."))}${c.closeType?"　"+CC.escapeHtml(c.closeType):""}`
      : (next?`<b>次回</b>${CC.escapeHtml(CC.eventLine(next))}`:"まだ期日の登録がありません");
    return `<div class="card ccard" data-open="${CC.escapeAttr(c.id)}" role="link" tabindex="0">
      <div class="cbody">
        <div class="ctitle">${CC.escapeHtml(c.name)}</div>
        <div class="cnext">${nextLine}</div>
        <div class="cfoot">
          <div class="tags">${(c.tags||[]).map(t=>`<span class="tag">${CC.escapeHtml(t)}</span>`).join("")}</div>
          <span class="clike"><i class="bi bi-heart-fill" aria-hidden="true"></i>${c.likes||0}</span>
        </div>
      </div>
    </div>`;
  }
  // 検索・タグだけを反映した候補（タブの件数表示に使う。ステータスでは絞らない）
  function filteredBase(){
    const q=qEl.value.trim().toLowerCase();
    return CC.cases.filter(c=> (!q || c.name.toLowerCase().includes(q)) && (!activeTag || (c.tags||[]).includes(activeTag)));
  }
  function renderTabs(){
    const base=filteredBase();
    const openN=base.filter(c=>!c.archivedAt).length;
    const archN=base.filter(c=>c.archivedAt).length;
    statusTabs.innerHTML = `
      <span class="${activeStatus==="open"?"on":""}" data-statusf="open">進行中 ${openN}</span>
      <span class="${activeStatus==="archived"?"on":""}" data-statusf="archived">終結 ${archN}</span>`;
    statusTabs.querySelectorAll("[data-statusf]").forEach(s=>{
      s.addEventListener("click",()=>{ activeStatus=s.dataset.statusf; renderAll(); });
    });
  }
  function renderList(){
    if(!CC.loaded){ clistEl.innerHTML=`<p class="empty-msg">読み込んでいます…</p>`; return; }
    const list=filteredBase()
      .filter(c=> activeStatus==="archived" ? !!c.archivedAt : !c.archivedAt)
      .sort((a,b)=>{
        if(activeStatus==="archived") return (b.archivedAt||"").localeCompare(a.archivedAt||"");
        const na=CC.nextEvent(a.id), nb=CC.nextEvent(b.id);
        if(na && nb) return na.date===nb.date ? 0 : (na.date<nb.date?-1:1);
        if(na) return -1;
        if(nb) return 1;
        return a.name.localeCompare(b.name,"ja");
      });
    clistEl.innerHTML = list.length ? list.map(rowHtml).join("") : `<p class="empty-msg">見つかりませんでした。</p>`;
    clistEl.querySelectorAll("[data-open]").forEach(el=>{
      const go=()=>{ location.href="case?id="+encodeURIComponent(el.dataset.open); };
      el.addEventListener("click",go);
      el.addEventListener("keydown",(e)=>{ if(e.key==="Enter") go(); });
    });
  }
  function renderAll(){
    renderTagFilters();
    renderTabs();
    renderList();
    CC.renderStatus(statusEl);
  }
  CC.setOnChange(renderAll);
  qEl.addEventListener("input", ()=>{ renderTabs(); renderList(); });

  (async function init(){
    renderAll();
    await CC.load();
    renderAll();
  })();
})();
</script>
</body>
</html>
