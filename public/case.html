<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>事件の詳細 ｜ 応援傍聴ナビ</title>
<meta name="description" content="傍聴席に、ひとり増える。それだけで法廷は変わる。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23f2e4c9'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="stamp" aria-hidden="true">傍聴</div>
    <div>
      <h1><a href="index.html">応援傍聴ナビ</a></h1>
      <p>傍聴席に、ひとり増える。それだけで法廷は変わる。</p>
    </div>
  </header>

  <a class="backlink" href="cases.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> 事件をさがすに戻る</a>

  <section aria-labelledby="case-h" style="margin-top:28px">
    <div id="caseBody"></div>
  </section>

  <p class="status" id="status"></p>
  <input type="file" id="fileInput" accept="application/json,.json" style="display:none;">

  <footer class="site-footer">
    <a href="request.html">掲載をご希望の方へ</a><span class="sep">・</span><a href="https://github.com/minnanosaiban/court-calendar" target="_blank" rel="noopener">ソースコード（GitHub）</a> <i class="bi bi-box-arrow-up-right" aria-hidden="true"></i>
    <p class="disc">本サイトは有志による非公式のツールです。掲載情報の正確性・完全性・最新性は保証しません。本サイトの利用により生じたいかなる損害についても運営者は責任を負わず、本サイトは法的助言を提供するものではありません。事件の説明は呼びかけ人の主張であり、裁判所が認定した事実とは限りません。当事者のお名前は、ご本人が実名での掲載を望まれる場合をのぞき掲載しません。</p>
  </footer>
</div>

<!-- 期日・事件情報・資料・写真の編集モーダルは lib.js が1つの窓として生成する（EXTRA_MODALS） -->

<script src="lib.js"></script>
<script>
(function(){
  "use strict";
  const caseBody=document.getElementById("caseBody");
  const statusEl=document.getElementById("status");
  // ?id=事件ID で開く。古いリンク（?case=事件名）も、読み込み後に名前で引いて開く
  const qs = new URLSearchParams(location.search);
  let caseId = qs.get("id") || "";
  const legacyName = qs.get("case") || "";

  function renderAll(){
    if(!caseId && legacyName && CC.loaded){
      const c=CC.caseByName(legacyName); if(c) caseId=c.id;
    }
    CC.renderCaseDetail(caseBody, caseId || legacyName, {full:true});
    CC.renderStatus(statusEl);
    const c=CC.caseById(caseId);
    if(c) document.title = c.name + " ｜ 応援傍聴ナビ";
  }
  CC.setOnChange(renderAll);

  (async function init(){
    renderAll();
    await CC.load();
    renderAll();
  })();
})();
</script>
</body>
</html>
