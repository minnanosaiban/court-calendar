<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期日をさがす ｜ 応援傍聴ナビ</title>
<meta name="description" content="傍聴席に、ひとり増える。それだけで法廷は変わる。">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="stamp" aria-hidden="true">傍聴</div>
    <div>
      <h1><a href="index.html">応援傍聴ナビ</a></h1>
      <p>傍聴席に、ひとり増える。それだけで法廷は変わる。</p>
    </div>
  </header>

  <a class="pillbtn backlink" href="index.html"><i class="bi bi-arrow-left" aria-hidden="true"></i> トップに戻る</a>

  <section aria-labelledby="search-h" style="margin-top:28px">
    <p class="sech" id="search-h">期日をさがす</p>
    <div class="search"><i class="bi bi-search" aria-hidden="true"></i><input type="text" id="q" placeholder="事件名で検索" aria-label="事件名で検索"></div>
    <div class="tags" id="tagFilters" style="margin-top:14px"></div>
    <div class="tabs" id="periodTabs"></div>
    <div class="sortrow"><span class="sortlink" id="sortToggle" role="button" tabindex="0"><i class="bi bi-arrow-down-up" aria-hidden="true"></i> <span id="sortLabel"></span></span></div>
    <div class="card ucard" id="dlist"></div>
  </section>

  <p class="status" id="status"></p>
  <input type="file" id="fileInput" accept="application/json,.json" style="display:none;">

  <footer class="site-footer">
    <a href="request-quick.html">掲載をご希望の方へ</a><span class="sep">・</span><a href="https://github.com/minnanosaiban/court-calendar" target="_blank" rel="noopener">ソースコード（GitHub）</a> <i class="bi bi-box-arrow-up-right" aria-hidden="true"></i>
    <p class="disc">本サイトは有志による非公式のツールです。掲載情報の正確性・完全性・最新性は保証しません。本サイトの利用により生じたいかなる損害についても運営者は責任を負わず、本サイトは法的助言を提供するものではありません。事件の説明は呼びかけ人の主張であり、裁判所が認定した事実とは限りません。当事者のお名前は、ご本人が実名での掲載を望まれる場合をのぞき掲載しません。</p>
  </footer>
</div>

<!-- 期日・事件情報・資料・写真の編集モーダルは lib.js が1つの窓として生成する（EXTRA_MODALS） -->

<script src="lib.js"></script>
<script>
(function(){
  "use strict";
  const qEl=document.getElementById("q");
  const tagFilters=document.getElementById("tagFilters");
  const periodTabs=document.getElementById("periodTabs");
  const sortToggle=document.getElementById("sortToggle");
  const sortLabel=document.getElementById("sortLabel");
  const dlistEl=document.getElementById("dlist");
  const statusEl=document.getElementById("status");
  let activeTag = new URLSearchParams(location.search).get("tag") || "";
  let activePeriod = "upcoming";   // "upcoming"=今後 / "past"=過去
  let sortAsc = true;              // true=日付が古い順（今後タブでは＝近い順） / false=日付が新しい順

  // タグは期日そのものではなく、その事件のタグを使う（事件をさがす と同じ絞り込み体験にそろえる）
  function allTagsWithCount(){
    const m=new Map();
    CC.events.forEach(ev=>{
      const c=CC.caseById(ev.caseId);
      (c&&c.tags||[]).forEach(t=>m.set(t,(m.get(t)||0)+1));
    });
    return [...m.entries()].sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0],"ja"));
  }
  function renderTagFilters(){
    const tags=allTagsWithCount();
    if(!tags.length){ tagFilters.innerHTML=""; return; }
    let html = `<a class="tag${!activeTag?" on":""}" data-tagf="">すべて</a>`;
    html += tags.map(([t])=>`<a class="tag${activeTag===t?" on":""}" data-tagf="${CC.escapeAttr(t)}">${CC.escapeHtml(t)}</a>`).join("");
    tagFilters.innerHTML = html;
    tagFilters.querySelectorAll("[data-tagf]").forEach(a=>{
      a.addEventListener("click",(e)=>{ e.preventDefault(); activeTag=a.dataset.tagf; renderTagFilters(); renderTabs(); renderList(); });
    });
  }
  // トップの「今後の期日」と同じ見た目の行（.u）を、そのまま検索一覧としても使う
  function rowHtml(ev){
    const c=CC.caseById(ev.caseId);
    const d=CC.parseYmd(ev.date);
    const place=[ev.court,ev.place].filter(Boolean).join(" ");
    return `<div class="u" data-open="${CC.escapeAttr(ev.caseId)}" role="link" tabindex="0">
      <span class="ubar${ev.open===false?" shut":""}" aria-hidden="true"></span>
      ${c?CC.iconHtml(c):""}
      <div class="ubody">
        <div class="ud"><b>${d.getMonth()+1}/${d.getDate()}</b>（${CC.WD[d.getDay()]}）${ev.time?" "+CC.escapeHtml(ev.time):""}</div>
        <div class="ut">${CC.escapeHtml(ev.case)}</div>
        <div class="um">${CC.escapeHtml([ev.type,place].filter(Boolean).join(" ／ "))||"&nbsp;"}</div>
      </div>
    </div>`;
  }
  // 検索・タグだけを反映した候補（タブの件数表示に使う。期間では絞らない）。
  // 検索は「事件をさがす」と同じく事件名だけを見る（種別・裁判所などは対象外）
  function filteredBase(){
    const q=qEl.value.trim().toLowerCase();
    return CC.events.filter(ev=>{
      const c=CC.caseById(ev.caseId);
      return (!q || ev.case.toLowerCase().includes(q)) && (!activeTag || (c&&c.tags||[]).includes(activeTag));
    });
  }
  // 終結した事件の期日は、日付の前後にかかわらず「過去」扱いにする（事件をさがす の 進行中/終結 と同じ考え方）
  function isUpcoming(ev){
    return ev.date>=CC.todayStr() && !CC.isArchived(ev.caseId);
  }
  function renderTabs(){
    const base=filteredBase();
    const upN=base.filter(isUpcoming).length;
    const pastN=base.length-upN;
    periodTabs.innerHTML = `
      <span class="${activePeriod==="upcoming"?"on":""}" data-periodf="upcoming">今後 ${upN}</span>
      <span class="${activePeriod==="past"?"on":""}" data-periodf="past">過去 ${pastN}</span>`;
    periodTabs.querySelectorAll("[data-periodf]").forEach(s=>{
      s.addEventListener("click",()=>{
        activePeriod=s.dataset.periodf;
        sortAsc = activePeriod==="upcoming";   // タブを切り替えたら、そのタブの自然な順（今後＝近い順／過去＝新しい順）に戻す
        renderAll();
      });
    });
  }
  function renderSort(){
    sortLabel.textContent = sortAsc ? "期日が古い順" : "期日が新しい順";
  }
  function renderList(){
    if(!CC.loaded){ dlistEl.innerHTML=`<p class="empty-msg">読み込んでいます…</p>`; return; }
    const list=filteredBase()
      .filter(ev=> activePeriod==="upcoming" ? isUpcoming(ev) : !isUpcoming(ev))
      .sort((a,b)=> sortAsc
        ? (a.date===b.date ? CC.byTime(a,b) : a.date.localeCompare(b.date))
        : (a.date===b.date ? CC.byTime(a,b) : b.date.localeCompare(a.date)));
    dlistEl.innerHTML = list.length ? list.map(rowHtml).join("") : `<p class="empty-msg">見つかりませんでした。</p>`;
    dlistEl.querySelectorAll("[data-open]").forEach(el=>{
      const go=()=>{ location.href="case?id="+encodeURIComponent(el.dataset.open); };
      el.addEventListener("click",go);
      el.addEventListener("keydown",(e)=>{ if(e.key==="Enter") go(); });
    });
  }
  function renderAll(){
    renderTagFilters();
    renderTabs();
    renderSort();
    renderList();
    CC.renderStatus(statusEl);
  }
  CC.setOnChange(renderAll);
  qEl.addEventListener("input", ()=>{ renderTabs(); renderList(); });
  sortToggle.addEventListener("click", ()=>{ sortAsc=!sortAsc; renderSort(); renderList(); });
  sortToggle.addEventListener("keydown",(e)=>{ if(e.key==="Enter"){ sortAsc=!sortAsc; renderSort(); renderList(); } });

  (async function init(){
    renderAll();
    await CC.load();
    renderAll();
  })();
})();
</script>
</body>
</html>
